# victorialogs-consumer configuration.
# Pass the path as argv[1], or install at /etc/rave/victorialogs-consumer.toml.
# One consumer instance per environment: it reads one Iggy stream and writes to
# one VictoriaLogs tenant. Dev=AccountID 1, prod=AccountID 2 (convention).

[iggy]
# iggy://<user>:<password>@<host>:<tcp-port>  (single-quoted TOML literal if the
# password contains '#').
connection_string = 'iggy://rave-log-consumer:secret@10.20.0.10:8090'
stream      = "dev-logs"
topic       = "journal"
partitions  = [0]         # list of partition ids to consume
consumer_id = 1

[victorialogs]
url        = "http://10.20.0.11:9428"
account_id = 1            # VictoriaLogs tenant: dev=1, prod=2
project_id = 0
msg_field     = "MESSAGE"                      # -> _msg
time_field    = "_SOURCE_REALTIME_TIMESTAMP"   # -> _time (us unix; absent => ingest time)
stream_fields = ["_HOSTNAME", "_SYSTEMD_UNIT", "_SYSTEMD_USER_UNIT"]
ignore_fields = ["__cursor"]                   # drop the agent's internal cursor field

[batch]
max_messages          = 500
idle_poll_interval_ms = 1000

[state]
path = "/var/lib/rave-victorialogs-consumer/offsets.json"

[backoff]
initial_ms = 500
max_ms     = 30000
multiplier = 2.0
jitter     = true
